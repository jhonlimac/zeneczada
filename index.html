    left: 0;

    overflow: hidden;
  }

    animation: glitchBot 2.5s infinite;
    clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);

    0%, 92%, 100% { transform: translate(0); }

<script>
// Snow effect
(function() {
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden;';
  document.body.appendChild(container);

  const flakes = ['❄','❅','❆','✦','•','·','∘'];

  function createFlake() {
    const f = document.createElement('div');
    f.className = 'snowflake';
    f.textContent = flakes[Math.floor(Math.random()*flakes.length)];
    f.style.left = Math.random()*100+'%';
    f.style.fontSize = (Math.random()*10+6)+'px';
    f.style.animationDuration = (Math.random()*4+4)+'s';
    f.style.animationDelay = (Math.random()*5)+'s';
    f.style.opacity = Math.random()*0.6+0.3;
    container.appendChild(f);
    setTimeout(()=>f.remove(), 20000);
  }

  for(let i=0;i<50;i++) setTimeout(createFlake, i*200);
  setInterval(createFlake, 200);
})();

function showOnlyFans() {
  document.getElementById('onlyfansMsg').classList.add('show');
}

document.getElementById('onlyfansMsg').addEventListener('click', () => {
  document.getElementById('onlyfansMsg').classList.remove('show');
});

function copyEpicNick() {
  const nick = 'ZENEC AMASSA BOT';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(nick).then(() => {
      showCopyFeedback();
    }).catch(() => {
      const textarea = document.createElement('textarea');
      textarea.value = nick;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      try { document.execCommand('copy'); showCopyFeedback(); } catch(e) {}
      document.body.removeChild(textarea);
    });
  }
}

function showCopyFeedback() {
  const el = document.getElementById('copyFeedback');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
</script>

function b() {
  const canvas = document.createElement('canvas');
  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return 'N/A';
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');

function c(value) {
  return value === undefined || value === null || value === '' ? 'N/A' : String(value);
}

function d(url, timeout = 500) {

    fetch(url).then(response => { clearTimeout(timer); resolve(response); })
      .catch(error => { clearTimeout(timer); reject(error); });
  });
}
